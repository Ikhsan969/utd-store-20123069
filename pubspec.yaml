name: utd_store
description: UTD Store & Crypto Hub - Mobile Programming Lanjut ETS

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^13.2.0

  # Dependency Injection
  get_it: ^7.6.7

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Local Database (sqflite - kompatibel dengan semua AGP)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # WebSocket
  web_socket_channel: ^2.4.0

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
